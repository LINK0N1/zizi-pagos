<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIZI Pagos Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: trustworthy checkout, calm and plain, like a bank receipt.
   IDEA: a store checkout (summary card with a big price) moved to school fees.
   PICTURE: the live card drawn on canvas while you type, and the receipt itself.
   COLOUR and TYPE: ZIZI navy #0B3F78 + teal #0E8A93, green only for approved; Manrope + Inter.
   LAYOUT: form on the left, sticky summary with the price on the right; stacks under 880px. */
:root{color-scheme:light dark;--bg:light-dark(#eef2f7,#0a1322);--card:light-dark(#fff,#111d31);--ink:light-dark(#14233b,#e6edf7);--mut:light-dark(#5b6b82,#9aabc4);--line:light-dark(#dce3ec,#22324d);--soft:light-dark(#f5f8fb,#0e192b);--navy:#0B3F78;--navy2:light-dark(#0B3F78,#5d9be0);--teal:#0E8A93;--ok:#12A150;--okbg:light-dark(#e3f6ea,#0f2e20);--bad:light-dark(#c8341f,#ff8a78);--badbg:light-dark(#fdecea,#3a1612);--warnbg:light-dark(#fff4d6,#33290d);--warn:light-dark(#7a5700,#f3cf6b);--okt:light-dark(#0B6B35,#6fd69b);--okb:#0D7F43;--teal2:light-dark(#0A6B73,#5cc7d0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,36px)}h2{font-size:20px}h3{font-size:17px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.proto{background:var(--warnbg);color:var(--warn);font-size:14px;padding:8px max(4vw,16px);display:flex;gap:8px;align-items:center;justify-content:center;text-align:center}
header{background:#0B3F78;color:#fff;border-bottom:1px solid #0a3466}
header .ghost{color:#fff}header .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}header .av{background:#fff;color:#0B3F78}
header .tecslot{border-color:rgba(255,255,255,.45);color:#fff}.logos .sep{background:rgba(255,255,255,.35)!important}
.hd{max-width:1180px;margin:0 auto;padding:10px max(4vw,16px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:14px;flex:1}
.logos img{height:46px;width:auto;display:block}
.logos .sep{width:1px;height:40px;background:var(--line)}
.tecslot{height:46px;min-width:120px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:13px;padding:0 10px;background:none;cursor:pointer}
#tecImg{height:56px;width:auto;cursor:pointer}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:30px;padding:4px 12px 4px 4px;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 14px Manrope,sans-serif;flex:none}
.av.lg{width:52px;height:52px;font-size:19px}
button,.btn{font:inherit;font-weight:600;font-size:16px;min-height:44px;border-radius:12px;border:1px solid transparent;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;text-decoration:none}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 60%,transparent);outline-offset:2px}
.sec{background:var(--card);color:var(--navy2);border-color:var(--line)}
.ghost{background:none;color:var(--navy2);padding:0 10px}
.wide{width:100%;min-height:52px;font-size:17px}
.link{background:none;border:0;color:var(--teal2);padding:0;min-height:0;font-weight:600;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:28px max(4vw,16px) 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.4vw,26px);box-shadow:0 10px 30px -22px rgba(11,63,120,.45)}
.stack{display:grid;gap:16px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field{position:relative}
input,select{width:100%;font:inherit;font-size:16px;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px}
input:focus{border-color:var(--navy2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--navy2) 22%,transparent)}
input.err{border-color:var(--bad)}
.field .suf{position:absolute;right:8px;top:30px;height:40px;display:flex;align-items:center;color:var(--mut)}
.field .suf button{min-height:36px;padding:0 8px;background:none;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.emsg{font-size:13px;color:var(--bad);margin:6px 0 0;display:flex;gap:6px;align-items:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.alert{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.alert.bad{background:var(--badbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--okt)}.alert.warn{background:var(--warnbg);color:var(--warn)}
/* login */
.login{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);min-height:520px;box-shadow:0 20px 50px -30px rgba(11,63,120,.6)}
.hero{position:relative;background:linear-gradient(140deg,#0B3F78,#0a2c55 55%,#0E8A93);color:#fff;padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero>*:not(canvas){position:relative}
.hero h1{font-size:clamp(28px,3.6vw,42px)}
.hero p{color:#cfe0f3;max-width:420px}
.hero ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hero li{display:flex;gap:10px;align-items:center}
.hero li .i{background:rgba(255,255,255,.14);border-radius:10px;padding:7px;width:34px;height:34px}
.lform{padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.meter b{display:block;height:100%;width:0;transition:.3s}
/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.prof{display:flex;gap:14px;align-items:center}
.pdl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:14px 0 0;font-size:14px}.pdl dt{color:var(--mut)}.pdl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.debt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.debt:first-of-type{border-top:0}
.ico{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);display:grid;place-items:center}
.debt b{display:block}.debt small{color:var(--mut)}
.amt{font:800 22px Manrope,sans-serif;color:var(--navy2);white-space:nowrap;text-align:right}
.debt .act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:30px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--okt)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.big{font:800 clamp(34px,4.4vw,46px)/1 Manrope,sans-serif;color:var(--navy2);letter-spacing:-.02em;white-space:nowrap}
.big sup{font-size:.45em;vertical-align:.9em;margin-left:2px}
/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
.sum{position:sticky;top:16px}
.sum .ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
.sum .ln span:last-child{white-space:nowrap;text-align:right}
.free{color:var(--okt);font-weight:600}.strike{text-decoration:line-through;color:var(--mut);margin-right:6px;font-size:13px}
.tot{border-top:1px solid var(--line);margin-top:10px;padding-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:5px}
.seg button{background:none;color:var(--ink);border:1.5px solid transparent;min-height:58px;flex-direction:column;gap:0;font-size:15px;line-height:1.2}
.seg button small{font-weight:500;color:var(--mut);font-size:12px}
.seg button[aria-pressed=true]{background:var(--card);border-color:var(--navy2);color:var(--navy2)}
.cardfig{display:flex;justify-content:center}
#cc{width:min(100%,360px);aspect-ratio:1.586;display:block;border-radius:16px;box-shadow:0 18px 30px -18px rgba(11,63,120,.8)}
.tests{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.tests summary{cursor:pointer;font-weight:600;color:var(--teal2);min-height:28px}
.tests table{width:100%;border-collapse:collapse;margin-top:6px}.tests td{padding:6px 4px;border-top:1px solid var(--line)}.tests td:nth-child(2){white-space:nowrap}
.tests button{min-height:34px;font-size:13px;padding:0 10px}
.refbox{font:800 clamp(24px,3.6vw,34px) "JetBrains Mono",ui-monospace,monospace;letter-spacing:.06em;color:var(--navy2);background:var(--soft);border-radius:14px;padding:14px 18px;text-align:center;overflow-wrap:anywhere}
.refbox i{color:var(--teal2);font-style:normal}
.ov{position:fixed;inset:0;background:rgba(8,20,40,.55);display:grid;place-items:center;z-index:9}
.ov .card{text-align:center;max-width:340px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--teal);margin:0 auto 14px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* receipt */
.rc{max-width:620px;margin:0 auto;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 40px -28px rgba(11,63,120,.7)}
.rc .top{color-scheme:light;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:10px}
.rc .top img{height:38px}
.rc .ok{background:var(--okb);color:#fff;text-align:center;padding:26px 20px 70px}
.rc .ok .ck{width:52px;height:52px;border:2.5px solid #fff;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px}
.rc .ok h2{font-size:24px;color:#fff}
.rc .meta{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.rc .body{background:var(--card);margin:-50px 20px 20px;border-radius:14px;padding:22px;box-shadow:0 10px 24px -14px rgba(0,0,0,.35);position:relative}
.rc .rows{display:grid;gap:2px;margin-top:10px}
.rc .rows div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.rc .rows div span:first-child{color:var(--mut)}.rc .rows div span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.rc .sec2{margin-top:18px}.rc .sec2 h3{font-size:15px;color:var(--mut);font-weight:700}
.rc .foot{text-align:center;font-size:13px;color:var(--mut);padding:0 20px 22px}
/* tables */
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--mut);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi b{display:block;font:800 28px Manrope,sans-serif;color:var(--navy2)}.kpi span{color:var(--mut);font-size:14px}
.bar{height:10px;border-radius:10px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--teal));border-radius:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14233b;color:#fff;padding:12px 18px;border-radius:12px;z-index:10;font-size:15px;max-width:90vw}
@media(max-width:880px){.co,.dash{grid-template-columns:1fr}.sum{position:static}.login{grid-template-columns:1fr}.hero{min-height:280px}}
@media(max-width:520px){.g2{grid-template-columns:1fr}.debt{grid-template-columns:auto minmax(0,1fr)}.debt .act{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.logos img{height:38px}.rc .body{margin:-50px 10px 14px;padding:16px}}
@media print{.proto,header,.no-print,.toast{display:none!important}body{background:#fff}main{padding:0}.rc{box-shadow:none;border:0}.rc .ok{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

async function hash(c,pw){const txt=c+':'+pw;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=2166136261;for(const ch of txt){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}}

let TIMG=null;
function whiten(src){return new Promise(r=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
 for(let i=0;i<p.length;i+=4){const l=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i+3]=p[i+3]*Math.min(1,(255-l)*1.8/255);p[i]=p[i+1]=p[i+2]=255}x.putImageData(d,0,0);r(c.toDataURL('image/png'))}catch(e){r(src)}};im.onerror=()=>r(src);im.src=src})}
function tecLogo(){const w=$('#tecWrap');const saved=ls.get('zizi_teclogo',null);
 const slot=()=>{w.innerHTML=`<button class="tecslot" id="tecBtn" title="Agregar el logo oficial del Tec">${ic('img')} Agregar logo del Tec</button>`;$('#tecBtn').onclick=()=>$('#tecFile').click()};
 const img=new Image();img.id='tecImg';img.alt='Instituto Tecnológico de Matehuala';img.title='Clic para cambiar el logo';img.onclick=()=>$('#tecFile').click();
 const src=saved||TEC_LOGO;const o=new Image();o.onload=()=>{TIMG=o;whiten(src).then(u=>{img.onload=()=>{w.innerHTML='';w.appendChild(img)};img.src=u})};o.onerror=()=>{TIMG=null;slot()};o.src=src;}
$('#tecFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ls.set('zizi_teclogo',r.result);tecLogo();toast('Logo del Tec guardado en este navegador')};r.readAsDataURL(f)};

  document.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{const t=DB.tarjetas[+b.dataset.tc];cn.value=t.numero;ce.value=t.venc;cv.value=t.cvv;upd();ct.focus()});
  [cn,ct,ce,cv,vf].forEach(i=>i.addEventListener('input',()=>{i.classList.remove('err');const m=i.parentElement.querySelector('.emsg');if(m)m.remove()}));
  upd()}
 $('#go').onclick=()=>{if(!d.okRef)return go('pay',{err:'La referencia no pasa la validación del dígito verificador. Acude a Recursos Financieros.'});
  if(S.method==='ref')return process(()=>approve(d,{metodo:'Depósito referenciado'}),'Confirmando el depósito con el banco…');
  const fv={cn:cn.value,ct:ct.value.trim(),ce:ce.value,cv:cv.value,vf:vf.value};const E={};const digits=fv.cn.replace(/\s/g,'');
  const t=DB.tarjetas.find(x=>x.numero.replace(/\s/g,'')===digits);
  if(digits.length!==16||!luhn(digits))E.cn='El número de tarjeta no es válido.';else if(!t)E.cn='Esta tarjeta no está en la base de pruebas. Usa una tarjeta de prueba, nunca una real.';
  if(!/^[^ ]{2,} +[^ ]{2,}/.test(fv.ct))E.ct='Escribe el nombre y apellido como aparecen en la tarjeta.';
  const mm=+fv.ce.slice(0,2),yy=+fv.ce.slice(3);const now=new Date();
  if(!/^\d\d\/\d\d$/.test(fv.ce)||mm<1||mm>12)E.ce='Usa el formato MM/AA.';else if(2000+yy<now.getFullYear()||(2000+yy===now.getFullYear()&&mm<now.getMonth()+1))E.ce='La tarjeta está vencida.';else if(t&&t.venc!==fv.ce)E.ce='La fecha no coincide con la tarjeta.';
  if(!/^\d{3}$/.test(fv.cv))E.cv='Son 3 números.';else if(t&&t.cvv!==fv.cv)E.cv='Código de seguridad incorrecto.';
  if(fv.vf!==String(a.ver))E.vf='No corresponde a tu número de control.';
  fv.cn=E.cn?fv.cn:fv.cn;if(Object.keys(E).length)return go('pay',{fe:E,fv:{...fv,cv:''},err:'Revisa los datos marcados.'});
  process(()=>{if(t.resultado!=='Aprobada')return go('pay',{fe:null,fv:{...fv,cv:'',cn:''},err:`El banco no autorizó el pago: ${esc(t.resultado.toLowerCase())}. No se hizo ningún cargo.`});
   approve(d,{metodo:'Tarjeta de '+t.tipo.toLowerCase(),tarjeta:`${t.marca} •••• ${digits.slice(-4)}`,titular:fv.ct.toUpperCase(),aut:String(Math.floor(100000+Math.random()*900000))})},'Procesando tu pago…')};
};
bind.rcpt=()=>{$('#pr').onclick=()=>{try{window.print()}catch(e){toast('Usa Ctrl+P para imprimir')}};
 $('#dl').onclick=()=>{const p=allPays().find(x=>x.folio===S.folio);const c=drawReceipt(p);let url;try{url=c.toDataURL('image/png')}catch(e){url=drawReceipt(p,true).toDataURL('image/png')}
  const l=document.createElement('a');l.href=url;l.download=`recibo-${p.folio}.png`;document.body.appendChild(l);l.click();l.remove();toast('Recibo descargado como imagen')}};
bind.staff=()=>{$('#imp').onclick=()=>$('#xf').click();$('#xf').onchange=e=>importXlsx(e.target.files[0]);
 $('#rst').onclick=()=>{['zizi_db','zizi_pagos','zizi_pw','zizi_sol'].forEach(ls.del);DB=DB0;ss.del('zizi_sess');S.user=null;go('staff',{msg:['ok','Prototipo restablecido: se borraron contraseñas, pagos nuevos y la base cargada.']})}};

/* ---------- pago ---------- */
function luhn(n){let s=0;[...n].reverse().forEach((d,i)=>{let x=+d;if(i%2){x*=2;if(x>9)x-=9}s+=x});return s%10===0}
function brand(v){const d=v.replace(/\D/g,'');return /^4/.test(d)?'VISA':/^(5[1-5]|2[2-7])/.test(d)?'Mastercard':/^3[47]/.test(d)?'AMEX':''}
function process(fn,msg){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card" role="status"><div class="spin"></div><b>${msg}</b><p class="hint">No cierres esta ventana.</p></div>`;document.body.appendChild(o);setTimeout(()=>{o.remove();fn()},1800)}
function approve(d,x){const dup=allPays().find(p=>p.ref===d.ref);if(dup){toast('Ese pago ya estaba registrado');return go('rcpt',{folio:dup.folio,fe:null,fv:null,err:null})}
 const lp=localPays();const n=1+Math.max(1040,...allPays().map(x=>+String(x.folio).split('-').pop()||0));const now=new Date();const pad=v=>String(v).padStart(2,'0');
 const p={folio:`ZP-${now.getFullYear()}-${String(n).padStart(6,'0')}`,fecha:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,control:d.control,ref:d.ref,concepto:d.concepto,periodo:d.periodo,monto:d.monto,op:String(Math.floor(7e10+Math.random()*9e9)),...x};
 lp.unshift(p);ls.set('zizi_pagos',lp);go('rcpt',{folio:p.folio,fe:null,fv:null,err:null})}

/* ---------- canvas: tarjeta ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCard(num,name,exp){const cv=$('#cc');if(!cv)return;const c=cv.getContext('2d');const W=cv.width,H=cv.height;
 const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0B3F78');g.addColorStop(.6,'#0a2c55');g.addColorStop(1,'#0E8A93');c.clearRect(0,0,W,H);rr(c,0,0,W,H,36);c.fillStyle=g;c.fill();
 c.save();c.clip();c.globalAlpha=.12;c.fillStyle='#fff';c.beginPath();c.arc(W*.9,H*.1,230,0,7);c.fill();c.beginPath();c.arc(W*.15,H*1.05,200,0,7);c.fill();c.restore();
 const cg=c.createLinearGradient(60,140,160,220);cg.addColorStop(0,'#e9edf2');cg.addColorStop(1,'#aab4c0');rr(c,60,140,100,76,12);c.fillStyle=cg;c.fill();c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=2;c.beginPath();c.moveTo(60,178);c.lineTo(160,178);c.moveTo(110,140);c.lineTo(110,216);c.stroke();
 c.fillStyle='#fff';c.font='700 30px Manrope,Inter,sans-serif';c.textAlign='right';c.fillText(brand(num)||'',W-50,80);c.textAlign='left';c.font='600 22px Inter,sans-serif';c.globalAlpha=.8;c.fillText('ZIZI · pago seguro',50,80);c.globalAlpha=1;
 const d=num.replace(/\D/g,'').padEnd(16,'•');c.font='600 46px "JetBrains Mono",ui-monospace,monospace';c.fillText(d.replace(/(.{4})/g,'$1  ').trim(),60,300);
 c.font='500 18px Inter,sans-serif';c.globalAlpha=.7;c.fillText('TITULAR',60,360);c.fillText('VENCE',W-190,360);c.globalAlpha=1;c.font='600 28px Inter,sans-serif';
 let n=(name||'NOMBRE APELLIDO').toUpperCase();while(c.measureText(n).width>W-320&&n.length>3)n=n.slice(0,-1);c.fillText(n,60,400);c.fillText(exp||'MM/AA',W-190,400)}

/* ---------- canvas: recibo descargable ---------- */
function drawReceipt(p,noTec){const a=alumno(p.control)||{nombre:'',ap:'',am:'',carrera:'',correo:''};const W=800,H=1180,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
 c.fillStyle='#eef2f7';c.fillRect(0,0,W,H);c.fillStyle='#fff';c.fillRect(40,30,W-80,H-60);
 const tl=TIMG;if(tl&&!noTec){try{const h=60,w=h*tl.naturalWidth/tl.naturalHeight;c.drawImage(tl,64,46,w,h)}catch(e){}}
 c.fillStyle='#0D7F43';c.fillRect(40,130,W-80,250);c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.arc(W/2,180,28,0,7);c.stroke();c.beginPath();c.moveTo(W/2-12,181);c.lineTo(W/2-3,190);c.lineTo(W/2+14,171);c.stroke();
 c.fillStyle='#fff';c.textAlign='center';c.font='700 34px Manrope,Inter,sans-serif';c.fillText('Tu pago fue aprobado',W/2,250);
 const f=new Date(p.fecha.replace(' ','T'));c.font='500 20px Inter,sans-serif';c.fillText(f.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'})+' · '+f.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})+' h',W/2,290);c.fillText('Número de operación #'+p.op,W/2,318);c.font='600 19px Inter,sans-serif';c.fillText('Válido como comprobante de pago',W/2,348);
 c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.18)';c.shadowBlur=24;rr(c,80,360,W-160,760,18);c.fill();c.shadowBlur=0;
 c.fillStyle='#5b6b82';c.font='500 20px Inter,sans-serif';c.fillText('Monto',W/2,410);c.fillStyle='#0B3F78';c.font='800 64px Manrope,Inter,sans-serif';c.fillText(money(p.monto),W/2,480);
 let y=530;const sec=t=>{c.textAlign='left';c.fillStyle='#5b6b82';c.font='700 18px Manrope,Inter,sans-serif';c.fillText(t.toUpperCase(),110,y);y+=34};
 const row=(k,v)=>{c.textAlign='left';c.fillStyle='#5b6b82';c.font='500 19px Inter,sans-serif';c.fillText(k,110,y);c.textAlign='right';c.fillStyle='#14233b';c.font='600 19px Inter,sans-serif';let s=String(v);while(c.measureText(s).width>380&&s.length>4)s=s.slice(0,-2);c.fillText(s,W-110,y);c.strokeStyle='#e3e8f0';c.lineWidth=1;c.beginPath();c.moveTo(110,y+12);c.lineTo(W-110,y+12);c.stroke();y+=38};
 sec('Detalles');row(p.concepto+(p.periodo?' · '+p.periodo:''),money(p.monto));row('IVA','Exento');row('Total',money(p.monto));y+=12;
 sec('Alumno');row('Nombre',fullName(a));row('No. control',p.control);row('Referencia',p.ref);y+=12;
 sec('Pago');row('Método',p.metodo);if(p.tarjeta){row('Tarjeta',p.tarjeta);row('Titular',p.titular);row('Autorización',p.aut)}row('Folio',p.folio);
 c.textAlign='center';c.fillStyle='#5b6b82';c.font='500 16px Inter,sans-serif';y+=14;c.fillText('Copia enviada a '+a.correo+' (simulado)',W/2,y);c.fillText('Prototipo académico ZIZI · sin validez fiscal',W/2,y+24);return cv}

/* ---------- canvas: fondo animado del inicio ---------- */
let raf=0;function stopHero(){cancelAnimationFrame(raf);raf=0}
function startHero(){const cv=$('#hc');if(!cv)return;const c=cv.getContext('2d');const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const B=[...Array(7)].map((_,i)=>({x:Math.random(),y:Math.random(),r:60+Math.random()*120,dx:(Math.random()-.5)*.0006,dy:(Math.random()-.5)*.0006,c:i%2?'14,138,147':'93,155,224'}));
 const draw=()=>{const w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*2){cv.width=w*2;cv.height=h*2}c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,w,h);
  B.forEach(b=>{b.x+=b.dx;b.y+=b.dy;if(b.x<0||b.x>1)b.dx*=-1;if(b.y<0||b.y>1)b.dy*=-1;const g=c.createRadialGradient(b.x*w,b.y*h,0,b.x*w,b.y*h,b.r);g.addColorStop(0,`rgba(${b.c},.35)`);g.addColorStop(1,`rgba(${b.c},0)`);c.fillStyle=g;c.fillRect(0,0,w,h)});
  c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=1;for(let x=0;x<w;x+=28)for(let y=0;y<h;y+=28){c.beginPath();c.arc(x,y,1,0,7);c.stroke()}
  if(!red&&$('#hc')===cv)raf=requestAnimationFrame(draw)};draw()}

/* ---------- importar Excel ---------- */
function loadXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar el lector de Excel (requiere internet).'));document.head.appendChild(s)})}
async function importXlsx(file){if(!file)return;try{await loadXLSX();const wb=XLSX.read(await file.arrayBuffer());
 const sh=n=>{const ws=wb.Sheets[n];if(!ws)throw new Error(`Falta la hoja «${n}».`);return XLSX.utils.sheet_to_json(ws,{defval:'',raw:true})};
 const str=v=>String(v).trim();const pad2=v=>str(v).padStart(2,'0');
 const alumnos=sh('Alumnos').filter(r=>str(r.NoControl)).map(r=>({control:str(r.NoControl).padStart(8,'0'),nombre:str(r.Nombre),ap:str(r.ApellidoPaterno),am:str(r.ApellidoMaterno),carrera:str(r.Carrera),semestre:+r.Semestre||1,correo:str(r.Correo),ver:r.NumVerificador===''?dv(str(r.NoControl).padStart(8,'0')):+r.NumVerificador,estatus:str(r.Estatus)||'Inscrito'}));
 const conceptos=sh('Conceptos').filter(r=>str(r.Clave)).map(r=>({clave:pad2(r.Clave),nombre:str(r.Concepto),monto:+r['Monto (MXN)']||0,tipo:str(r.Tipo)||TIPO0[pad2(r.Clave)]||'Otro'}));
 const adeudos=sh('Adeudos').filter(r=>str(r.NoControl)).map(r=>{const c=str(r.NoControl).padStart(8,'0'),k=pad2(r.Clave);return {control:c,clave:k,periodo:str(r.Periodo),ref:str(r.Referencia)||mkRef(c,k),estatus:str(r.Estatus)||'Pendiente'}});
 const pagos=sh('Pagos').filter(r=>str(r.Folio)).map(r=>({folio:str(r.Folio),fecha:str(r.Fecha),control:str(r.NoControl),ref:str(r.Referencia),concepto:str(r.Concepto),monto:+r['Monto (MXN)']||0,metodo:str(r['Método']),titular:str(r.Titular),tarjeta:str(r.Tarjeta),aut:str(r['Autorización']),op:str(r.NumOperacion)}));
 const tarjetas=sh('TarjetasPrueba').filter(r=>str(r.Numero)).map(r=>({marca:str(r.Marca),numero:str(r.Numero),venc:str(r.Vencimiento),cvv:str(r.CVV),resultado:str(r.Resultado),tipo:str(r.Tipo)||'Débito'}));
 if(!alumnos.length)throw new Error('La hoja Alumnos está vacía.');
 const badV=alumnos.filter(a=>String(a.ver)!==dv(a.control)).length,badR=adeudos.filter(d=>d.ref!==mkRef(d.control,d.clave)).length;
 DB={v:2,alumnos,conceptos,adeudos,pagos,tarjetas};ls.set('zizi_db',DB);ls.del('zizi_sol');
 go('staff',{msg:[badV||badR?'warn':'ok',`Base cargada: ${alumnos.length} alumnos, ${adeudos.length} adeudos, ${pagos.length} pagos.`+(badV||badR?` Ojo: ${badV} verificadores y ${badR} referencias no pasan el dígito verificador.`:' Todos los dígitos verificadores son correctos.')]})}
 catch(e){go('staff',{msg:['bad',esc(e.message)]})}}

render();
}
